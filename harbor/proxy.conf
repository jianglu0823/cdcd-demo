# cicd-net 内的 Harbor 代理:监听 80,透传到 Harbor 真正的 nginx(容器名 nginx,端口 8080)。
# 存在的原因:Harbor 的 nginx 内部只 listen 8080,宿主靠 80->8080 映射;
# 但集群内(kind)容器间直连走的是容器真实端口,拿不到宿主映射。
# 于是在 cicd-net 里放这个代理,持有别名 harbor.cicd.local 并 listen 80,
# 让宿主(:80 映射)和集群内(:80 经此代理)都统一用 80 访问 Harbor。
worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  # nginx-photon 以非 root 运行,把各类 temp 路径指到可写的 /tmp
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  # registry 上传大镜像层,关掉体积限制
  client_max_body_size 0;
  server {
    listen 80;
    location / {
      proxy_pass http://nginx:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
    }
  }
}
